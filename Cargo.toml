[package]
name = "wireutils"
version = "0.1.0"
edition = "2021"
description = "IPs editor for multiple AmnesiaWG configs"

[build-dependencies]
# Compiles wireutils.manifest into a Win32 resource and links it in. Windows
# only — the build script is a no-op elsewhere, and this dependency is not
# pulled at all unless the target is Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# The wx GUI. Without it the crate builds as a plain library + logic tests,
# which is all that can be verified in a container with no wx and no display.
gui = ["dep:wxdragon", "dep:log"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Catalog updates only. Kept feature-light (no TLS backend of its own) so a
# container build has nothing to compile but Rust.
ureq = { version = "2", default-features = false, features = ["json"] }
wxdragon = { version = "0.9", optional = true }
# Tray diagnostics. Windows GUI subsystem builds have no console, so a line
# printed to stdout goes nowhere; the `log` facade is the seam that lets the
# tray say why it did nothing without dragging a backend into the library.
log = { version = "0.4", optional = true }

[lib]
name = "wireutils"
path = "src/lib.rs"

[[bin]]
name = "wireutils-cli"
path = "src/main.rs"

# The window as its own executable: the one that goes on the desktop. It needs
# the `gui` feature to be a program at all, so the build is refused without it
# rather than producing an exe that starts and dies.
[[bin]]
name = "wireutils"
path = "src/bin/wireutils.rs"
required-features = ["gui"]

# The tray icon as its own executable, for the recipients: the one that lives
# in the notification area and keeps their config current without anyone
# touching the client machine. Same feature gate as the window, and for the
# same reason.
[[bin]]
name = "wireutils-tray"
path = "src/bin/wireutils-tray.rs"
required-features = ["gui"]
