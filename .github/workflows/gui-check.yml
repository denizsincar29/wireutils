name: gui-check

# The `gui` feature pulls wxdragon, which cannot be compiled in the agent's
# container (no wx, no display, no C toolchain). This workflow is the only
# place the GUI code is actually type-checked: it runs a full `cargo check`
# with the feature on and prints every diagnostic, so the author can paste the
# output back instead of copying long rustc messages with a screen reader.
#
# It also *runs* the assertions in `src/guiassert.rs`. Those stand in for the
# asserts inside wxWidgets, which are invisible from Rust on the owner's
# machine: `wxASSERT` aborts a debug build and does nothing at all on a release
# one, so a wrong status-bar field index compiles clean and surfaces as a
# vanishing window instead of a message. The guards are ordinary `#[cfg(test)]`
# code, but they only compile behind `--features gui`, so this is the one job
# where they can be executed at all.
#
# It is a check, not a gate: nothing blocks a merge and no artifact is
# published. The `-Z`/nightly flags are deliberately absent.

on:
  workflow_dispatch:
  push:
    branches: ["core", "main"]
  pull_request:

jobs:
  check-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --features gui
        id: check
        shell: bash
        run: |
          # tee сохраняет вывод для артефакта, но глушит код возврата: без
          # явного exit job рапортует success даже с ошибками компиляции —
          # зелёная галочка начинала врать. Выходим кодом cargo, а не tee.
          set -o pipefail
          cargo check --features gui --message-format=short 2>&1 | tee check.log

      - name: cargo test --features gui
        # --no-fail-fast: a second failing guard is information, not noise.
        # The job is allowed to fail here without hiding the check above: both
        # steps run, both land in the summary, and the log artifact holds both.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --features gui --lib --no-fail-fast 2>&1 | tee test.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### cargo check --features gui'
            echo
            echo '```'
            tail -n 200 check.log
            echo '```'
            if [ -f test.log ]; then
              echo
              echo '### cargo test --features gui'
              echo
              echo '```'
              tail -n 200 test.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-check-log
          path: |
            check.log
            test.log
          if-no-files-found: warn

  # The executable the owner actually double-clicks. Built here because the
  # agent's container has no wx and no C toolchain, and because a Windows
  # machine with a Rust toolchain on it is exactly what this job is running
  # on. A release build is the point: a debug build shows the console window
  # and — worse for this program — wxWidgets' own asserts are only live in a
  # debug build, so a wrong status-bar index would abort the window on the
  # owner's machine instead of being caught here.
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build --release --features gui
        shell: bash
        run: cargo build --release --features gui --bin wireutils

      # The window is built with the `gui` feature; the CLI bin is built
      # without it so `wireutils-cli.exe` keeps working on a machine that has
      # no wxWidgets installed. Both come out of the same commit.
      - name: Build the CLI too, without wx
        shell: bash
        run: cargo build --release --bin wireutils-cli

      - name: Upload wireutils.exe
        uses: actions/upload-artifact@v4
        with:
          name: wireutils-windows-exe
          path: |
            target/release/wireutils.exe
            target/release/wireutils-cli.exe
          if-no-files-found: error

      # Printed into the run summary so the owner can read the version of the
      # file they are about to download without opening it.
      - name: Name the artifact in the summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Windows build'
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- artifact: \`wireutils-windows-exe\`"
            ls -l target/release/wireutils.exe target/release/wireutils-cli.exe 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
